name: Release

# Push a tag vX.Y.Z (matching the version in the code and CHANGELOG.md) to release.
# Images go to REGISTRY/IMAGE: by default ghcr.io/<owner>/<repo> with the built-in token. For
# another registry (e.g. Gitea's), set the repository variables REGISTRY and IMAGE and the
# secrets REGISTRY_USERNAME and REGISTRY_TOKEN.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write # the release
  packages: write # ghcr.io

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: [checks]
    # Only the GitHub repository publishes (a mirror elsewhere may run this workflow too).
    if: github.repository_owner == 'ahammerton'
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
      IMAGE: ${{ vars.IMAGE || github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Tag matches the version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' backend/magarr/__init__.py)"
          if [ "$tag" != "$code" ]; then
            echo "::error::Tag v$tag but the code says $code"; exit 1
          fi
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "::error::No CHANGELOG entry for $tag"; exit 1; }
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          echo "image=$(echo "$REGISTRY/$IMAGE" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Release notes from the changelog
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: softprops/action-gh-release@v3
        with:
          name: Magarr ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: docs/api/openapi.json
